# ============================================================
# Seoul Date App — 로컬 개발 Docker Compose (Spring Cloud MSA)
#
# 실행:         docker compose up -d
# 종료:         docker compose down
# 전체 초기화:  docker compose down -v
#
# [프로필 분리]
# 인프라만:     docker compose up -d                       (기본)
# Spring Cloud: docker compose --profile cloud up -d      (Eureka + Config + Gateway + Zipkin)
# AI 포함:      docker compose --profile ai up -d
# 앱 전체:      docker compose --profile app up -d
# ============================================================

networks:
  date-net:
    driver: bridge

volumes:
  mysql-user-data:
  mysql-place-data:
  mysql-rec-data:
  mongo-data:
  redis-data:
  kafka-data:
  es-data:
  qdrant-storage:
  minio-data:
  zipkin-data:

services:

  # ==========================================================
  # ■ INFRASTRUCTURE — 기본 실행 대상
  # ==========================================================

  # ---------- MySQL user_db (port 3306) ----------
  mysql-user:
    image: mysql:8.0
    container_name: date-mysql-user
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
      - ./infra/mysql/init/01_user_db.sql:/docker-entrypoint-initdb.d/01_user_db.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    networks:
      - date-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- MySQL place_db (port 3307) ----------
  mysql-place:
    image: mysql:8.0
    container_name: date-mysql-place
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: place_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-place-data:/var/lib/mysql
      - ./infra/mysql/init/02_place_db.sql:/docker-entrypoint-initdb.d/02_place_db.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    networks:
      - date-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- MySQL recommendation_db (port 3308) ----------
  mysql-rec:
    image: mysql:8.0
    container_name: date-mysql-rec
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: recommendation_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql-rec-data:/var/lib/mysql
      - ./infra/mysql/init/03_recommendation_db.sql:/docker-entrypoint-initdb.d/03_recommendation_db.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    networks:
      - date-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- MongoDB (port 27017) ----------
  mongodb:
    image: mongo:7.0
    container_name: date-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: date_app
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongodb/init/01_init.js:/docker-entrypoint-initdb.d/01_init.js:ro
    command: mongod --wiredTigerCacheSizeGB 0.25
    networks:
      - date-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Redis (port 6379) ----------
  # Gateway Rate Limit, JWT RT, 추천 캐시 공용
  redis:
    image: redis:7.2-alpine
    container_name: date-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infra/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - date-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Kafka KRaft (port 9092 / 9094) ----------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: date-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 52428800
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka 토픽 자동 생성 (init 컨테이너)
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: date-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo '--- Kafka 토픽 생성 시작 ---'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seoul.place.updated        --partitions 3 --replication-factor 1 --config retention.ms=86400000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seoul.event.updated        --partitions 3 --replication-factor 1 --config retention.ms=86400000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seoul.realtime.congestion  --partitions 6 --replication-factor 1 --config retention.ms=3600000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic place.image.upload         --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic recommendation.requested   --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vector.embed.requested     --partitions 3 --replication-factor 1
      echo '--- 토픽 생성 완료 ---'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - date-net

  # Kafka UI (개발 편의, port 8989)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: date-kafka-ui
    restart: unless-stopped
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - date-net

  # ---------- Elasticsearch (port 9200) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: date-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es-node-1
      - cluster.name=date-es-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ---------- Qdrant Vector DB (port 6333/6334) — profile: ai ----------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: date-qdrant
    restart: unless-stopped
    profiles: ["ai"]
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- MinIO Object Storage (port 9000/9001) ----------
  minio:
    image: minio/minio:RELEASE.2024-03-26T22-10-45Z
    container_name: date-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - date-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MinIO 버킷 자동 생성
  minio-init:
    image: minio/mc:latest
    container_name: date-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      mc mb --ignore-existing local/places
      mc mb --ignore-existing local/reviews
      mc mb --ignore-existing local/events
      mc mb --ignore-existing local/users
      mc anonymous set download local/places
      mc anonymous set download local/events
      echo '--- MinIO 버킷 초기화 완료 ---'
      mc ls local
      "
    networks:
      - date-net

  # ---------- Nginx (port 80) ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: date-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - minio
    networks:
      - date-net

  # ==========================================================
  # ■ SPRING CLOUD — profile: cloud
  #   기동 순서: config-server → eureka-server → api-gateway + zipkin
  # ==========================================================

  # ---------- Spring Cloud Config Server (port 8888) ----------
  config-server:
    image: eclipse-temurin:21-jre-alpine
    container_name: date-config-server
    restart: unless-stopped
    profiles: ["cloud", "app"]
    ports:
      - "8888:8888"
    volumes:
      - ./services/config-server/build/libs/config-server.jar:/app/app.jar:ro
      - ./infra/config-repo:/config-repo:ro          # 로컬 파일 시스템 기반 config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native                  # 로컬 파일 시스템 사용 (native)
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo/{application}
      SERVER_PORT: 8888
      JAVA_OPTS: "-Xmx128m -Xms64m"
    entrypoint: ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Eureka Server (port 8761) ----------
  eureka-server:
    image: eclipse-temurin:21-jre-alpine
    container_name: date-eureka-server
    restart: unless-stopped
    profiles: ["cloud", "app"]
    ports:
      - "8761:8761"
    volumes:
      - ./services/eureka-server/build/libs/eureka-server.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      JAVA_OPTS: "-Xmx128m -Xms64m"
    entrypoint: ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Zipkin (port 9411) ----------
  # 분산 트레이싱 수집 서버
  zipkin:
    image: openzipkin/zipkin:3
    container_name: date-zipkin
    restart: unless-stopped
    profiles: ["cloud", "app"]
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem          # 로컬: 인메모리 / 프로덕션: elasticsearch
      JAVA_OPTS: "-Xmx128m -Xms64m"
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health | grep -q 'OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Spring Cloud Gateway (port 8080) ----------
  # NestJS API Gateway를 대체. Eureka 연동 동적 라우팅 + JWT GlobalFilter + Resilience4j CB
  api-gateway:
    image: eclipse-temurin:21-jre-alpine
    container_name: date-api-gateway
    restart: unless-stopped
    profiles: ["cloud", "app"]
    ports:
      - "8080:8080"
    volumes:
      - ./services/api-gateway/build/libs/api-gateway.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx256m -Xms128m"
    entrypoint: ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - date-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==========================================================
  # ■ APPLICATIONS — profile: app (서비스 빌드 후 주석 해제)
  # ==========================================================

