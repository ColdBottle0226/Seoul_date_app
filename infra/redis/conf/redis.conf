# ============================================================
# Redis 설정 — 로컬 개발
# ============================================================

# 비밀번호
requirepass redis1234!

# 최대 메모리
maxmemory 512mb

# 메모리 부족 시 정책: LRU 기반으로 TTL 있는 키 먼저 제거
maxmemory-policy allkeys-lru

# 저장 주기 (900초 내 1번 이상 변경 시 저장)
save 900 1
save 300 10
save 60 10000

# 데이터 디렉토리
dir /data

# AOF (Append Only File) — 데이터 내구성
appendonly yes
appendfsync everysec

# 로그 레벨
loglevel notice

# 클라이언트 최대 연결
maxclients 100

# 키스페이스 알림 (만료 이벤트 구독 가능)
notify-keyspace-events Ex
