spring:
  application:
    name: eureka-server

  # ============================================================
  # Config Server 연동
  # Eureka도 config-server에서 설정을 받을 수 있도록 설정
  # optional: → Config Server 없어도 기동 가능
  # ============================================================
  config:
    import: "optional:configserver:${SPRING_CONFIG_SERVER_URI:http://config-server:8888}"

server:
  port: ${SERVER_PORT:8761}
  # 응답 헤더에 서버 정보 미노출
  server-header: ""

# ============================================================
# [Eureka Server 핵심 설정]
#
# eureka.instance.hostname:
#   클라이언트가 이 서버에 접근할 때 사용하는 주소
#   Docker 내부에서는 서비스명(eureka-server)을 사용
#
# eureka.client.register-with-eureka: false
#   Eureka Server 자신은 레지스트리에 등록하지 않음
#   (클라이언트가 아니므로)
#
# eureka.client.fetch-registry: false
#   Eureka Server는 레지스트리를 조회할 필요 없음
#   (스스로가 레지스트리이므로)
# ============================================================
eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:eureka-server}

    # ----------------------------------------------------------
    # [인스턴스 메타데이터]
    # 클라이언트가 서버 메타정보 조회 시 반환되는 정보
    # zone: 멀티 Zone 환경에서 동일 Zone 우선 라우팅에 사용
    # ----------------------------------------------------------
    metadata-map:
      zone: ${EUREKA_ZONE:local}
      environment: ${SPRING_PROFILES_ACTIVE:local}

    # 헬스체크/상태 페이지 경로 (Actuator 기반)
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
    home-page-url-path: /

  client:
    # Eureka Server 자신은 등록/조회 안 함
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

  server:
    # ----------------------------------------------------------
    # [Self-Preservation Mode]
    # 네트워크 파티션 상황에서 정상 등록된 서비스를 보호하는 모드
    # true(운영): 짧은 시간에 많은 하트비트 실패가 발생해도
    #            서비스를 바로 제거하지 않음 → 일시적 장애 시 안정적
    # false(개발): 즉시 만료 인스턴스 제거 → 빠른 피드백
    # ⚠️ 운영 환경에서는 반드시 true 로 변경할 것
    # ----------------------------------------------------------
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}

    # 만료 인스턴스 정리 주기 (ms)
    eviction-interval-timer-in-ms: 5000

    # ----------------------------------------------------------
    # [응답 캐시 설정]
    # response-cache-update-interval-ms: 레지스트리 응답 캐시 갱신 주기
    # 기본값 30s → 5s로 단축 (실시간성 향상, 개발용)
    # 운영에서는 30s 또는 기본값 유지
    # ----------------------------------------------------------
    response-cache-update-interval-ms: 5000
    response-cache-auto-expiration-in-seconds: 60

    # 피어(다른 Eureka Server) 연결 대기 시간 (단일 서버이므로 짧게)
    wait-time-in-ms-when-sync-empty: 0

    # 최소 등록 서비스 비율 (Self-Preservation 트리거 임계치)
    renewal-percent-threshold: 0.85

# ============================================================
# [Actuator 설정]
# health: 전체 헬스 + Eureka 서버 상태
# info: 서버 정보
# metrics: JVM, HTTP 메트릭
# prometheus: Prometheus 스크래핑 엔드포인트
# env: 전체 환경변수 조회 (운영에서는 제거)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env
      base-path: /actuator
  endpoint:
    health:
      show-details: always   # Eureka 서버 내부 상태 포함 확인용
    env:
      show-values: never     # 운영: 환경변수 값 마스킹
  # Eureka Server 자체 메트릭 태그
  metrics:
    tags:
      application: ${spring.application.name}

# ============================================================
# [로깅]
# Eureka 내부 로그는 매우 장황하므로 WARN으로 억제
# spring.cloud.netflix.eureka.server 레벨만 INFO로 유지
# ============================================================
logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.cloud.netflix.eureka.server: INFO
    # 인스턴스 등록/해제 이벤트 확인
    com.netflix.eureka.registry.AbstractInstanceRegistry: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
