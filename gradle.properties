# ============================================================
# Gradle 프로젝트 전역 설정
# gradle.properties — 버전 관리에 포함 (시크릿 없음)
# ============================================================

# [JDK 경로 설정 — Gradle 데몬 실행 JVM]
# macOS Temurin 21 설치 경로 (brew install --cask temurin@21)
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
# 설치된 JDK 목록 확인: /usr/libexec/java_home -V

# [Gradle Daemon 설정]
org.gradle.daemon=true

# [JVM 메모리 설정]
# 멀티모듈 빌드 시 메모리 부족 방지
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# [병렬 빌드]
# 모듈이 많으므로 병렬 컴파일로 속도 향상
org.gradle.parallel=true

# [빌드 캐시]
org.gradle.caching=true

# ============================================================
# [의존성 버전 오버라이드]
# Spring Boot BOM 기본 버전을 재정의할 때 사용
# io.spring.dependency-management 플러그인이 자동으로 인식
# ============================================================
# Lombok: 1.18.34 = Java 23 완전 지원 (Spring Boot 3.2.5 기본값 1.18.32 미호환)
lombok.version=1.18.34
