# ============================================================
# Gradle 프로젝트 전역 설정
# gradle.properties — 버전 관리에 포함 (시크릿 없음)
# ============================================================

# [JDK 경로 설정 — 개발자 PC 종속 설정]
# 이 값은 개발자마다 JDK 경로가 다르므로 프로젝트 파일에 포함하지 않음
# 대신 각 개발자의 ~/.gradle/gradle.properties 에 아래 줄을 추가하세요:
#
#   org.gradle.java.home=/경로/to/jdk-21-or-higher
#
# macOS 기준: /Users/{username}/Library/Java/JavaVirtualMachines/openjdk-23/Contents/Home
# 설치된 JDK 목록 확인: /usr/libexec/java_home -V

# [Gradle Daemon 설정]
org.gradle.daemon=true

# [JVM 메모리 설정]
# 멀티모듈 빌드 시 메모리 부족 방지
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# [병렬 빌드]
# 모듈이 많으므로 병렬 컴파일로 속도 향상
org.gradle.parallel=true

# [빌드 캐시]
org.gradle.caching=true

# ============================================================
# [의존성 버전 오버라이드]
# Spring Boot BOM 기본 버전을 재정의할 때 사용
# io.spring.dependency-management 플러그인이 자동으로 인식
# ============================================================
# Lombok: 1.18.34 = Java 23 완전 지원 (Spring Boot 3.2.5 기본값 1.18.32 미호환)
lombok.version=1.18.34
